<title>쩡마술사 링크 모음</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 단일 컬럼 작업대. 위에서 아래로 가져오기 → 빠른 확인 → 목록. 헤더의 가로줄은 FDM 레이어 라인 */
:root {
  --bg: #f3f4f2;
  --surface: #ffffff;
  --ink: #1d2224;
  --muted: #5f686c;
  --line: #d9dddb;
  --accent: #d9480f;      /* 오렌지 PLA 필라멘트 */
  --accent-soft: #fbe7dc;
  --ok: #2b8a3e;
  --ok-soft: #e3f4e6;
  --warn: #9c6500;
  --warn-soft: #fbf0d6;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151819; --surface: #1e2224; --ink: #e6e9e8; --muted: #9aa3a6; --line: #30373a;
    --accent: #ff7a3d; --accent-soft: #3a2418; --ok: #6cc77f; --ok-soft: #1c2e21;
    --warn: #e5b04a; --warn-soft: #33290f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151819; --surface: #1e2224; --ink: #e6e9e8; --muted: #9aa3a6; --line: #30373a;
  --accent: #ff7a3d; --accent-soft: #3a2418; --ok: #6cc77f; --ok-soft: #1c2e21;
  --warn: #e5b04a; --warn-soft: #33290f; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 860px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 22px; }
h1, h2 { text-wrap: balance; margin: 0; }
h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 0.78rem; font-weight: 500; letter-spacing: 0.08em; color: var(--muted); }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.head { position: relative; padding: 22px 20px 18px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.head::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .55;
  background: repeating-linear-gradient(to bottom, transparent 0 5px, var(--line) 5px 6px);
  -webkit-mask-image: linear-gradient(to left, #000, transparent 70%); mask-image: linear-gradient(to left, #000, transparent 70%); }
.head > * { position: relative; }
.head p { margin: 4px 0 0; color: var(--muted); }
.stats { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 14px; font-size: .88rem; color: var(--muted); }
.stats b { color: var(--ink); font-weight: 500; font-family: var(--font-mono); font-size: 1.05rem; margin-right: 4px; font-variant-numeric: tabular-nums; }
.store { font-size: .78rem; }

/* panels */
.panel { display: flex; flex-direction: column; gap: 12px; }
.drop { border: 1.5px dashed var(--line); border-radius: var(--r); background: var(--surface); padding: 22px 18px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop strong { display: block; font-weight: 500; }
.drop span { color: var(--muted); font-size: .88rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row > .grow { flex: 1 1 220px; min-width: 0; }
input[type=text], input[type=search], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; }
textarea { width: 100%; min-height: 110px; resize: vertical; font-family: var(--font-mono); font-size: .82rem; }
label.inline { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .9rem; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 8px 14px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); padding-inline: 8px; }
.btn.ghost:hover { color: var(--ink); }
.btn:disabled { opacity: .5; cursor: default; }
details > summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
details[open] > summary { margin-bottom: 8px; }

/* preview */
.preview { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.summary { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .82rem; background: var(--bg); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.chip.new { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.chip.dup { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.names { font-size: .88rem; color: var(--muted); }
.names button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 1px 10px; margin: 3px 4px 0 0; cursor: pointer; font-size: .82rem; }
.stray { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.mini { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow-y: auto; border-top: 1px solid var(--line); }
.mini li { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: .86rem; display: flex; gap: 10px; min-width: 0; }
.mini .d { font-family: var(--font-mono); color: var(--muted); font-size: .78rem; flex: none; padding-top: 2px; }
.mini .t { min-width: 0; overflow-wrap: anywhere; }

/* quick check */
.qres { font-size: .9rem; min-height: 1.4em; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* list */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar .grow { flex: 1 1 200px; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 7px 14px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.map { position: relative; height: 72vh; min-height: 440px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; touch-action: none; }
.map svg { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; -webkit-user-select: none; }
.map svg.drag { cursor: grabbing; }
.map .edge { fill: none; stroke: var(--line); stroke-width: 1.4; }
.map .edge.trunk { stroke-width: 2.2; }
.map .edge.rel { stroke: var(--accent); stroke-dasharray: 5 4; stroke-width: 1.6; }
.map .root circle { fill: var(--accent); }
.map .root text { fill: #fff; font-weight: 700; font-size: 15px; }
.map .grp { cursor: pointer; }
.map .grp rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.map .grp.k-topic rect { stroke: var(--accent); }
.map .grp.k-list rect { stroke: var(--warn); }
.map .grp.open rect { fill: var(--accent-soft); }
.map .grp text { fill: var(--ink); font-size: 14px; font-weight: 500; }
.map .grp .cnt { fill: var(--muted); font-family: var(--font-mono); font-size: 12px; font-weight: 400; }
.map .itm { cursor: pointer; }
.map .itm text { fill: var(--ink); font-size: 12.5px; }
.map .itm.read text { fill: var(--muted); }
.map .itm .dotn { fill: var(--muted); }
.map .itm.sel text { fill: var(--accent); font-weight: 700; }
.map .itm.relh text { fill: var(--accent); }
.map .itm rect.fr { fill: none; stroke: var(--line); }
.map .itm.sel rect.fr { stroke: var(--accent); stroke-width: 2; }
.map .simt { fill: var(--accent); font-family: var(--font-mono); font-size: 10px; }
.mapctl { position: absolute; left: calc(10px + env(safe-area-inset-left, 0px)); bottom: 10px; display: flex; gap: 4px; }
.mapctl .btn { padding: 4px 10px; font-size: .85rem; }
.maphint { position: absolute; left: 12px; top: 10px; font-size: .8rem; color: var(--muted); pointer-events: none; }
.card { position: absolute; right: 10px; top: 10px; width: min(320px, calc(100% - 20px)); max-height: calc(100% - 20px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 6px 24px rgba(0,0,0,.12); padding: 12px; display: flex; flex-direction: column; gap: 6px; font-size: .88rem; }
.card .thumb { width: 100%; }
.card .ct { font-weight: 700; font-size: .95rem; overflow-wrap: anywhere; }
.card .row { gap: 6px; }
.card .rel { grid-column: auto; padding: 8px; }
.card .x { position: absolute; right: 6px; top: 4px; }
@media (max-width: 560px) { .card { top: auto; bottom: 52px; max-height: 50%; } .map { height: 78vh; } }
.month { font-size: .82rem; font-weight: 500; color: var(--muted); padding: 14px 0 6px; border-bottom: 1px solid var(--line); }
.items { list-style: none; margin: 0; padding: 0; }
.item { display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; gap: 6px 14px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: start; }
.item.read .title { color: var(--muted); font-weight: 400; }
.item.read .thumb { opacity: .6; }
.item.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
.thumb { display: block; width: 120px; aspect-ratio: 3 / 2; max-width: 100%; border-radius: 4px; overflow: hidden; background: var(--bg); border: 1px solid var(--line); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding: 6px 8px; color: #fff; font-size: .74rem; line-height: 1.25; font-weight: 500;
  background: repeating-linear-gradient(to bottom, transparent 0 4px, rgba(255,255,255,.12) 4px 5px), hsl(var(--h) 38% 42%); }
.ph b { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.item .meta { font-family: var(--font-mono); font-size: .76rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.item .sum { font-size: .86rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.item .kakao { font-size: .84rem; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item .kakao::before { content: "카톡 "; font-size: .72rem; color: var(--accent); font-weight: 500; }
.rel { grid-column: 2 / -1; display: flex; flex-direction: column; gap: 6px; background: var(--bg); border-radius: var(--r); padding: 10px 12px; }
.rel h3 { margin: 0; font-size: .78rem; font-weight: 500; color: var(--muted); }
.rel a { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-decoration: none; font-size: .86rem; }
.rel a:hover .rt { color: var(--accent); text-decoration: underline; }
.rel .thumb { width: 54px; }
.rel .ph { padding: 3px 4px; font-size: .6rem; }
.rel .ph b { font-size: .7rem; }
.rel .rt { overflow-wrap: anywhere; }
.rel .sim { font-family: var(--font-mono); font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.enrich { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: .86rem; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.enrich .grow { flex: 1 1 240px; min-width: 0; }
.enrich code { font-family: var(--font-mono); font-size: .8rem; background: var(--bg); padding: 1px 5px; border-radius: 3px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 1px; }
.dot.on { background: var(--ok); }
.dot.half { background: var(--warn); }
.item .body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.item .title { font-weight: 500; text-decoration: none; overflow-wrap: anywhere; }
.item .title:hover { color: var(--accent); text-decoration: underline; }
.item .url { font-family: var(--font-mono); font-size: .76rem; color: var(--muted); overflow-wrap: anywhere; }
.item .dom { display: inline-block; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; margin-right: 6px; color: var(--ink); }
.item .rep { color: var(--warn); font-family: var(--font-mono); font-size: .76rem; }
.item .acts { display: flex; gap: 2px; align-items: center; }
.item .acts .btn { font-size: .8rem; padding: 4px 8px; }
.item .acts .del-confirm { color: var(--accent); }
.empty { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 26px 20px; color: var(--muted); }
.empty ol { margin: 8px 0 0; padding-left: 20px; }
.more { align-self: center; }
footer { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-top: 1px solid var(--line); padding-top: 16px; font-size: .88rem; color: var(--muted); }
footer .sp { flex: 1; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: var(--r); font-size: .9rem; max-width: calc(100% - 32px); z-index: 20; }
@media (max-width: 560px) {
  .item { grid-template-columns: 88px minmax(0, 1fr); }
  .item .thumb { width: 88px; }
  .item .acts { grid-column: 2; }
  .rel { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) { .item.flash { animation: none; } .drop { transition: none; } }
</style>

<div class="wrap">
  <header class="head">
    <h1>쩡마술사 링크 모음</h1>
    <p>카톡방에 올라온 3D프린터 기사·자료 링크를 중복 없이 모아 둡니다.</p>
    <div class="stats">
      <span><b id="stTotal">0</b>링크</span>
      <span><b id="stUnread">0</b>안 읽음</span>
      <span><b id="stDup">0</b>중복으로 걸러짐</span>
      <span class="store" id="stStore">불러오는 중…</span>
    </div>
  </header>

  <section class="panel" aria-labelledby="hImport">
    <h2 id="hImport">대화 가져오기</h2>
    <label class="drop" id="drop" for="file">
      <strong>카톡 대화 내보내기 파일(.txt / .csv)을 여기에 끌어 놓기</strong>
      <span>또는 눌러서 파일 선택 · 같은 파일을 여러 번 넣어도 중복으로 쌓이지 않습니다</span>
    </label>
    <input type="file" id="file" accept=".txt,.csv,text/plain" hidden>
    <details id="pasteBox">
      <summary>텍스트로 붙여넣기</summary>
      <textarea id="paste" placeholder="대화 내용을 붙여넣으세요"></textarea>
      <div class="row" style="margin-top:8px">
        <button class="btn" id="parsePaste" type="button">분석</button>
        <button class="btn ghost" id="fillSample" type="button">예시 대화 넣어 보기</button>
      </div>
    </details>
    <div class="row">
      <label class="inline grow" for="target"><span style="white-space:nowrap">올린 사람</span>
        <input type="text" id="target" class="grow" value="쩡마술사" placeholder="이름 (여러 개면 쉼표로)">
      </label>
    </div>
    <div class="preview" id="preview" hidden></div>
  </section>

  <section class="panel" aria-labelledby="hQuick">
    <h2 id="hQuick">링크 하나 확인</h2>
    <div class="row">
      <input type="search" id="quick" class="grow" placeholder="링크를 붙여넣으면 이미 있는지 바로 알려줍니다">
    </div>
    <div class="qres" id="qres"></div>
  </section>

  <section class="panel" aria-labelledby="hList">
    <h2 id="hList">모은 링크</h2>
    <div class="toolbar">
      <input type="search" id="q" class="grow" placeholder="제목·주소 검색 (예: 밤부랩, 펌웨어, klipper)">
      <select id="dom" aria-label="사이트"><option value="">모든 사이트</option></select>
      <select id="sort" aria-label="정렬">
        <option value="new">최신순</option>
        <option value="old">오래된순</option>
        <option value="rep">많이 올라온 순</option>
      </select>
      <label class="inline" for="unread"><input type="checkbox" id="unread"> 안 읽은 것만</label>
      <div class="seg" role="group" aria-label="보기">
        <button type="button" id="vList" aria-pressed="true">목록</button>
        <button type="button" id="vMap" aria-pressed="false">마인드맵</button>
      </div>
    </div>
    <div class="enrich" id="enrich" hidden></div>
    <div id="list"></div>
    <div class="map" id="map" hidden>
      <svg id="mapSvg" role="img" aria-label="링크 마인드맵"></svg>
      <span class="maphint" id="mapHint">가지를 누르면 링크가 펼쳐집니다 · 끌어서 이동, 휠로 확대</span>
      <div class="mapctl">
        <button class="btn" type="button" id="mzIn" aria-label="확대">+</button>
        <button class="btn" type="button" id="mzOut" aria-label="축소">−</button>
        <button class="btn" type="button" id="mzFit">맞춤</button>
        <button class="btn" type="button" id="mzAll">모두 펼치기</button>
      </div>
      <aside class="card" id="mapCard" hidden></aside>
    </div>
  </section>

  <footer>
    <span id="foot"></span>
    <span class="sp"></span>
    <button class="btn" id="tidy" type="button">목록 정리</button>
    <button class="btn" id="expCsv" type="button">CSV 내보내기</button>
    <button class="btn" id="expJson" type="button">백업(JSON)</button>
    <label class="btn" for="impJson">백업 불러오기</label>
    <input type="file" id="impJson" accept=".json,application/json" hidden>
  </footer>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const LS_ITEMS = 'jjm-links-v1', LS_TARGET = 'jjm-target';
const MAX_SEEN = 60, PAGE = 200;

/* ---------- 카톡 내보내기 파서 ---------- */
// PC:      --------------- 2026년 10월 30일 목요일 ---------------  /  [이름] [오후 3:21] 내용
// Android: 2026년 10월 30일 오후 3:21, 이름 : 내용
// iOS:     2026. 10. 30. 오후 3:21, 이름 : 내용
// Mac CSV: 2026-10-30 15:21:00,"이름","내용"
const DATE = String.raw`(\d{4})(?:년\s*|\.\s*)(\d{1,2})(?:월\s*|\.\s*)(\d{1,2})(?:일|\.)?`;
const RE = {
  pcDay: /^-{3,}\s*(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/,
  // 닉네임에 ] 가 들어가도(예: [서울]홍길동) 시간 괄호까지 보고 자른다
  pcMsg: /^\[(.+?)\]\s*\[(오전|오후|AM|PM)?\s*(\d{1,2}):(\d{2})\s*(AM|PM)?\]\s?(.*)$/,
  mobMsg: new RegExp('^' + DATE + String.raw`\s*,?\s*(오전|오후|AM|PM)?\s*(\d{1,2}):(\d{2})(?:\s*(AM|PM))?\s*,\s*(.+?)\s:\s?(.*)$`),
  mobSys: new RegExp('^' + DATE + String.raw`\s*,?\s*(?:(?:오전|오후)\s*\d{1,2}:\d{2}|\d{1,2}:\d{2}|[월화수목금토일]요일)`),
  csv: /^(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2})(?::\d{2})?,"((?:[^"]|"")*)","(.*)$/,
};
// PC 내보내기의 시스템 줄(시간·이름 없음). 앞 메시지 내용으로 붙으면 안 된다
const SYS_RE = /^(?:.+님이 (?:들어왔습니다|나갔습니다|입장했습니다|퇴장했습니다)|.+님을 내보냈습니다|.+님이 .+님을 초대했습니다|.+님이 (?:방장|부방장).*|.*(?:방장|부방장)이 .+님(?:으로|에게).*|삭제된 메시지입니다|메시지가 삭제되었습니다|.*메시지를 가렸습니다|채팅방 관리자가 .+|운영정책을 위반한 메시지로 신고 접수 시.*|.+님과 카카오톡 대화|저장한 날짜\s*:.*)\.?$/;
const JUNK_RE = /님이 (?:들어왔습니다|나갔습니다|입장했습니다|퇴장했습니다)|님을 내보냈습니다|삭제된 메시지입니다|메시지를 가렸습니다/;
const pad = (n) => String(n).padStart(2, '0');
const ymd = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
function hm(h, m, ap) {
  h = +h;
  if (ap === '오후' || ap === 'PM') h = (h % 12) + 12;
  else if (ap === '오전' || ap === 'AM') h = h % 12;
  return `${pad(h)}:${pad(m)}`;
}

function parseChat(text) {
  const lines = text.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n').split('\n');
  const msgs = [];
  let cur = null, day = '';
  const flush = () => { if (cur) { msgs.push(cur); cur = null; } };
  for (const line of lines) {
    let m;
    if ((m = RE.pcDay.exec(line))) { flush(); day = ymd(m[1], m[2], m[3]); continue; }
    if ((m = RE.mobMsg.exec(line))) {
      flush();
      cur = { name: m[8].trim(), date: ymd(m[1], m[2], m[3]) + ' ' + hm(m[5], m[6], m[4] || m[7]), text: m[9] };
      continue;
    }
    if ((m = RE.csv.exec(line))) {
      flush();
      let body = m[4];
      if (body.endsWith('"')) body = body.slice(0, -1);
      cur = { name: m[3].replace(/""/g, '"').trim(), date: m[1] + ' ' + m[2], text: body.replace(/""/g, '"') };
      continue;
    }
    if ((m = RE.pcMsg.exec(line))) {
      flush();
      cur = { name: m[1].trim(), date: (day ? day + ' ' : '') + hm(m[3], m[4], m[2] || m[5]), text: m[6] };
      continue;
    }
    if (RE.mobSys.test(line)) { flush(); continue; }  // 모바일의 입장/퇴장 줄, 날짜 구분선
    if (SYS_RE.test(line.trim())) { flush(); continue; }  // PC의 입장/퇴장 줄: 다음 [이름] 줄까지 버림
    if (cur) cur.text += '\n' + line;
  }
  flush();
  return msgs;
}

/* ---------- 링크 추출 / 정규화 ---------- */
const URL_RE = /(?:https?:\/\/|www\.)[^\s<>"'`가-힣ㄱ-ㅎㅏ-ㅣ]+/gi;
const TRACK = /^(utm_.*|fbclid|gclid|dclid|igshid|igsh|si|ref|ref_src|ref_url|spm|mc_cid|mc_eid|_ga|_gl|feature|share_id|ocid|cmpid|sid|ad_id|rpxt|dlrf|mibextid|napm|srsltid|gad_source|share_source|share_medium|ttclid|twclid|trk|wt_mc)$/i;
// 글 id 가 경로에 있어 쿼리가 전부 추적용인 사이트
const NO_QUERY = /(^|\.)(instagram\.com|threads\.net|threads\.com|x\.com|twitter\.com|tiktok\.com|kickstarter\.com|reddit\.com|makerworld\.com|printables\.com|thingiverse\.com|cults3d\.com|aliexpress\.com|aliexpress\.us|github\.com)$/;
const TRAIL = /[)\]}>.,!?;:'"”’。、]+$/;

function urlMatches(text) {
  const out = [];
  for (const m of text.matchAll(URL_RE)) {
    const url = m[0].replace(TRAIL, '');
    if (url.length > 10) out.push({ url, start: m.index, end: m.index + url.length });
  }
  return out;
}
function extractUrls(text) { return urlMatches(text).map((m) => m.url); }

function normUrl(raw) {
  let s = raw.trim();
  if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
  let u;
  try { u = new URL(s); } catch { return s.toLowerCase(); }
  let host = u.hostname.toLowerCase().replace(/^(www|m|mobile)\./, '');
  let path = u.pathname;
  const p = u.searchParams;
  // 같은 글의 다른 주소 형태를 하나로
  if (host === 'youtu.be') return 'youtube.com/watch?v=' + path.slice(1).split('/')[0];
  if (host.endsWith('youtube.com')) {
    const sh = path.match(/^\/(?:shorts|live|embed)\/([\w-]+)/);
    if (sh) return 'youtube.com/watch?v=' + sh[1];
    if (p.get('v')) return 'youtube.com/watch?v=' + p.get('v');
  }
  if (host === 'blog.naver.com' && p.get('blogId') && p.get('logNo')) return `blog.naver.com/${p.get('blogId')}/${p.get('logNo')}`;
  if (host === 'n.news.naver.com') path = path.replace(/^\/mnews\//, '/');
  const keep = NO_QUERY.test(host) ? [] : [...p.entries()].filter(([k]) => !TRACK.test(k)).sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0);
  const q = new URLSearchParams(keep).toString();
  path = path.replace(/\/+$/, '').replace(/\/index\.(html?|php)$/i, '');
  return host + path + (q ? '?' + q : '');
}

function hostOf(norm) { return norm.split(/[/?]/)[0]; }

// FNV-1a 두 갈래 → 문서 id (db 경로에 쓸 수 있는 문자만)
function hid(s) {
  let a = 0x811c9dc5, b = 0x9747b28c;
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    a = Math.imul(a ^ c, 0x01000193);
    b = Math.imul(b ^ c, 0x5bd1e995); b ^= b >>> 15;
  }
  return 'l' + (a >>> 0).toString(36) + (b >>> 0).toString(36);
}

function describe(text) {
  return text.replace(URL_RE, ' ').replace(/\s+/g, ' ').trim().slice(0, 300);
}

const BULLET = /^(?:[-*•·▶►→☞✔✅◆◇■□○●※>]+|\d{1,2}[.)])\s*/;
function cleanLabel(s) {
  return s.replace(/\s+/g, ' ').trim().replace(BULLET, '').replace(/[\s:：\-–—=>→]+$/, '').trim().slice(0, 120);
}

// 링크가 하나면 메시지 전체가 설명. 여러 개면(판매처 목록 등) 링크마다 바로 옆의 글만 설명으로
//   이름↵링크↵이름↵링크   → 링크 위 줄 (이름 아래 링크가 연달아 있으면 같은 이름)
//   링크 이름↵링크 이름    → 링크 뒤 글
function linkLabels(text) {
  const ms = urlMatches(text);
  if (ms.length <= 1) return ms.map((m) => ({ url: m.url, desc: describe(text) }));
  const lineStart = (i) => text.lastIndexOf('\n', i - 1) + 1;
  const lineEnd = (i) => { const j = text.indexOf('\n', i); return j < 0 ? text.length : j; };
  const parts = ms.map((m, i) => {
    const prevEnd = i ? ms[i - 1].end : 0;
    const nextStart = i + 1 < ms.length ? ms[i + 1].start : text.length;
    const sameBefore = cleanLabel(text.slice(Math.max(prevEnd, lineStart(m.start)), m.start));
    const sameAfter = cleanLabel(text.slice(m.end, Math.min(nextStart, lineEnd(m.end))));
    const gapFrom = i ? Math.min(lineEnd(prevEnd), m.start) : 0;
    const gap = text.slice(gapFrom, lineStart(m.start)).split('\n').map(cleanLabel).filter(Boolean);
    return { sameBefore, sameAfter, prevLine: gap[gap.length - 1] || '' };
  });
  const afterMode = parts.filter((p) => p.sameAfter && !p.sameBefore).length > ms.length / 2;
  let last = '';
  return ms.map((m, i) => {
    const p = parts[i];
    let label = afterMode ? p.sameAfter : (p.sameBefore || p.prevLine || last);
    last = label;
    return { url: m.url, desc: label };
  });
}

// 날짜가 같은 기록은 하나로(정규화 규칙이 바뀌어 키 뒷부분이 달라도 같은 게시)
function mergeSeen(...lists) {
  const byDate = new Map();
  for (const list of lists) for (const k of list || []) { const d = k.split('|')[0]; if (!byDate.has(d)) byDate.set(d, k); }
  return [...byDate.values()].sort().slice(-MAX_SEEN);
}

/* ---------- 저장소: claude db, 없으면 localStorage ---------- */
const S = { items: new Map(), db: null, backend: 'pending', pending: null, ver: 0, open: new Set() };

// 예전 정규화로 만든 id 도 지금 규칙으로 찾을 수 있게
function findItem(id) {
  const it = S.items.get(id);
  if (it) return it;
  if (!S.alias || S.alias.ver !== S.ver) {
    const m = new Map();
    for (const x of S.items.values()) { const a = hid(normUrl(x.url)); if (a !== x.id && !m.has(a)) m.set(a, x); }
    S.alias = { ver: S.ver, m };
  }
  return S.alias.m.get(id);
}
// 3개 이상이 같은 설명이면 목록형 메시지에서 잘못 복사된 설명
function descCounts() {
  if (!S.dc || S.dc.ver !== S.ver) {
    const m = new Map();
    for (const x of S.items.values()) if (x.desc) m.set(x.desc, (m.get(x.desc) || 0) + 1);
    S.dc = { ver: S.ver, m };
  }
  return S.dc.m;
}
const usableDesc = (it) => (it.desc && !JUNK_RE.test(it.desc) && (descCounts().get(it.desc) || 0) < 3 ? it.desc : '');

function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } }

function loadLocal() {
  S.backend = 'local';
  try {
    const arr = JSON.parse(lsGet(LS_ITEMS) || '[]');
    S.items = new Map(arr.map((it) => [it.id, it]));
  } catch { S.items = new Map(); }
  S.ver++;
}
function saveLocal() {
  if (!lsSet(LS_ITEMS, JSON.stringify([...S.items.values()]))) toast('브라우저 저장소에 쓰지 못했습니다. 백업(JSON)으로 보관해 주세요.');
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function dbWrite(fn) {
  for (let i = 0; ; i++) {
    try { return await fn(); }
    catch (e) {
      const code = e && e.code;
      if (i < 4 && (code === 'resource_exhausted' || code === 'unavailable')) { await sleep(800 * (i + 1) + Math.random() * 400); continue; }
      throw e;
    }
  }
}

// 로컬 서버(server.py) API
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || 'HTTP ' + r.status), { code: 'http_' + r.status });
  return j;
}

// localStorage 모드에서만 전체를 한 번에 기록. db·서버는 항목마다 이미 기록됨
function persist() { if (S.backend === 'local') saveLocal(); }

async function putItem(it) {
  S.items.set(it.id, it);
  S.ver++;
  if (S.backend === 'db') {
    const { id, ...body } = it;
    await dbWrite(() => S.db.collection('links').doc(id).set(body));
  } else if (S.backend === 'server') {
    await api('PUT', '/api/items/' + it.id, it);
  }
}
async function delItem(id) {
  S.items.delete(id);
  S.ver++;
  if (S.backend === 'db') await dbWrite(() => S.db.collection('links').doc(id).delete());
  else if (S.backend === 'server') await api('DELETE', '/api/items/' + id);
  else saveLocal();
}
async function patchItem(id, patch) {
  const it = S.items.get(id);
  if (!it) return;
  Object.assign(it, patch);
  S.ver++;
  if (S.backend === 'db') await dbWrite(() => S.db.collection('links').doc(id).update(patch));
  else if (S.backend === 'server') await api('PATCH', '/api/items/' + id, patch);
  else saveLocal();
}

async function initStore() {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') {
    if (/^https?:$/.test(location.protocol)) {
      try {
        const ctl = new AbortController();
        setTimeout(() => ctl.abort(), 2000);
        const ping = await (await fetch('/api/ping', { signal: ctl.signal })).json();
        if (ping && ping.ok) {
          S.server = ping;
          S.items = new Map((await api('GET', '/api/items')).items.map((it) => [it.id, it]));
          S.backend = 'server'; S.ver++;
          render();
          return;
        }
      } catch { /* 서버 없음 → 브라우저 저장 */ }
    }
    loadLocal(); render(); return;
  }
  render();
  let db = null;
  try { db = await c.use('db'); } catch { db = null; }
  if (!db) { loadLocal(); render(); return; }
  S.db = db; S.backend = 'db';
  db.collection('links').onSnapshot((snap) => {
    S.items = new Map(snap.docs.map((d) => [d.id, { id: d.id, ...d.data() }]));
    S.loaded = true; S.ver++;
    render();
  }, (e) => {
    toast('저장소 연결이 끊겼습니다. 페이지를 새로 고쳐 주세요. (' + (e && e.code) + ')');
  });
}

/* ---------- 썸네일·제목 가져오기 (로컬 서버 전용) ---------- */
const embText = (it) => [it.title, it.summary, usableDesc(it), slugTitle(it.norm)].filter(Boolean).join('\n');
const embFresh = (it) => it.emb && it.embSrc === hid(embText(it));
function needsMeta(it) { return !it.fetched; }
function needsEmb(it) { return S.server && S.server.ollama === 'ready' && (!embFresh(it) || it.embModel !== S.server.model); }

async function enrichOne(it) {
  const patch = {};
  if (needsMeta(it)) {
    try {
      const m = await api('POST', '/api/enrich', { url: it.url });
      Object.assign(patch, { title: m.title || '', summary: m.summary || '', site: m.site || '', thumb: m.thumb || '', fetched: 'ok' });
    } catch (e) {
      patch.fetched = 'fail';
      patch.fetchErr = String(e.message || e).slice(0, 120);
    }
  }
  const next = { ...it, ...patch };
  if (needsEmb(next)) {
    try {
      const text = embText(next);
      const r = await api('POST', '/api/embed', { text });
      patch.emb = r.emb; patch.embModel = r.model; patch.embSrc = hid(text);
    } catch (e) {
      S.server.ollama = 'off';  // 한 번 실패하면 이번 실행에서는 임베딩을 건너뜀
    }
  }
  if (Object.keys(patch).length) await patchItem(it.id, patch);
}

async function runEnrich(onlyIds) {
  if (S.backend !== 'server' || S.enriching) return;
  const queue = [...S.items.values()].filter((it) => (!onlyIds || onlyIds.has(it.id)) && (needsMeta(it) || needsEmb(it)))
    .sort((a, b) => (b.first || '').localeCompare(a.first || ''));
  if (!queue.length) return;
  S.enriching = { done: 0, total: queue.length };
  renderEnrich();
  let lastPaint = 0;
  const worker = async () => {
    while (queue.length && S.enriching) {
      const it = queue.shift();
      await enrichOne(it).catch(() => {});
      S.enriching && S.enriching.done++;
      if (Date.now() - lastPaint > 700) { lastPaint = Date.now(); render(); }
      else renderEnrich();
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
  S.enriching = null;
  render();
}

function renderEnrich() {
  const box = $('enrich');
  const all = [...S.items.values()];
  if (!all.length) { box.hidden = true; return; }
  box.hidden = false;
  if (S.backend !== 'server') {
    const has = all.filter((i) => i.thumb || i.title).length;
    box.innerHTML = `<span class="grow">썸네일과 제목은 PC에서 <code>python server.py</code>를 실행해야 가져올 수 있습니다${has ? ` (${n(has)}개는 이미 있음)` : ''}. 거기서 백업(JSON)을 받아 여기서 불러오면 함께 보입니다.</span>`;
    return;
  }
  const meta = all.filter(needsMeta).length, emb = all.filter(needsEmb).length;
  const failed = all.filter((i) => i.fetched === 'fail').length;
  const st = S.server.ollama;
  const ol = st === 'ready' ? `<span><span class="dot on"></span>관련 자료: ${esc(S.server.model)} 임베딩</span>`
    : st === 'missing' ? `<span><span class="dot half"></span>관련 자료: 글자 비교 (<code>ollama pull ${esc(S.server.model)}</code> 하면 더 정확)</span>`
    : `<span><span class="dot"></span>관련 자료: 글자 비교 (Ollama 꺼져 있음)</span>`;
  const ctl = S.enriching
    ? `<span class="grow">가져오는 중… ${n(S.enriching.done)}/${n(S.enriching.total)}</span><button class="btn" type="button" id="enStop">멈춤</button>`
    : meta || emb
      ? `<span class="grow">${meta ? `정보 없는 링크 ${n(meta)}개` : ''}${meta && emb ? ' · ' : ''}${emb ? `벡터 없는 링크 ${n(emb)}개` : ''}</span><button class="btn primary" type="button" id="enGo">썸네일·제목 가져오기</button>`
      : `<span class="grow">모든 링크의 정보를 가져왔습니다${failed ? ` (실패 ${n(failed)}개)` : ''}.</span>${failed ? `<button class="btn ghost" type="button" id="enRetry">실패한 것 다시</button>` : ''}`;
  box.innerHTML = ctl + ol;
}

/* ---------- 관련 자료 ---------- */
function decodeEmb(b64) {
  const bin = atob(b64), v = new Float32Array(bin.length);
  let s = 0;
  for (let i = 0; i < bin.length; i++) { const x = (bin.charCodeAt(i) << 24) >> 24; v[i] = x; s += x * x; }
  const nrm = Math.sqrt(s) || 1;
  for (let i = 0; i < v.length; i++) v[i] /= nrm;
  return v;
}

// 글자 비교: 한글은 2글자 조각, 영문·숫자는 단어 단위로 TF-IDF
const STOP = new Set(['https', 'http', 'www', 'com', 'html', 'the', 'and', 'for', 'with', 'kr', 'ko', 'en', 'net', 'org', 'models', 'comments', 'watch']);
function tokens(text) {
  const out = [];
  const t = text.toLowerCase();
  for (const w of t.match(/[a-z][a-z0-9+]{1,}|\d{2,}[a-z]*/g) || []) if (!STOP.has(w)) out.push(w);
  for (const run of t.match(/[가-힣]+/g) || []) {
    if (run.length === 1) continue;
    for (let i = 0; i < run.length - 1; i++) out.push(run.slice(i, i + 2));
  }
  return out;
}
function buildIndex() {
  if (S.idx && S.idx.ver === S.ver) return S.idx;
  const items = [...S.items.values()];
  const df = new Map(), tf = new Map(), emb = new Map();
  for (const it of items) {
    const m = new Map();
    for (const tk of tokens([it.title, it.summary, usableDesc(it), slugTitle(it.norm)].filter(Boolean).join(' '))) m.set(tk, (m.get(tk) || 0) + 1);
    tf.set(it.id, m);
    for (const k of m.keys()) df.set(k, (df.get(k) || 0) + 1);
    if (embFresh(it)) { try { emb.set(it.id, { model: it.embModel, v: decodeEmb(it.emb) }); } catch {} }
  }
  const N = items.length, vec = new Map(), common = Math.max(8, N * 0.15);
  for (const [id, m] of tf) {
    const v = new Map(); let s = 0;
    for (const [k, c] of m) { const df_ = df.get(k); if ((df_ < 2 && N > 3) || df_ > common) continue; const w = (1 + Math.log(c)) * Math.log(1 + N / df_); v.set(k, w); s += w * w; }
    s = Math.sqrt(s) || 1;
    for (const k of v.keys()) v.set(k, v.get(k) / s);
    vec.set(id, v);
  }
  S.idx = { ver: S.ver, vec, emb };
  return S.idx;
}
function related(id, k = 5) {
  const ix = buildIndex();
  const me = S.items.get(id); if (!me) return [];
  const e = ix.emb.get(id), t = ix.vec.get(id);
  const out = [];
  for (const it of S.items.values()) {
    if (it.id === id) continue;
    let sim = 0, how = 'txt';
    const e2 = ix.emb.get(it.id);
    if (e && e2 && e.model === e2.model && e.v.length === e2.v.length) {
      for (let i = 0; i < e.v.length; i++) sim += e.v[i] * e2.v[i];
      how = 'emb';
    } else if (t) {
      const t2 = ix.vec.get(it.id);
      const [a, b] = t.size < t2.size ? [t, t2] : [t2, t];
      let hit = 0;
      for (const [kk, w] of a) { const w2 = b.get(kk); if (w2) { sim += w * w2; hit++; } }
      if (hit < 2) sim = 0;  // 조각 하나만 겹치는 우연한 일치는 제외
    }
    if (sim >= (how === 'emb' ? 0.6 : 0.15)) out.push({ it, sim, how });
  }
  return out.sort((a, b) => b.sim - a.sim).slice(0, k);
}

/* ---------- 표시용 이름 ---------- */
const SITE_NAMES = {
  'reddit.com': 'Reddit', 'makerworld.com': 'MakerWorld', 'youtube.com': 'YouTube', 'printables.com': 'Printables',
  'thingiverse.com': 'Thingiverse', 'github.com': 'GitHub', 'smartstore.naver.com': '스마트스토어', 'blog.naver.com': '네이버 블로그',
  'cafe.naver.com': '네이버 카페', 'n.news.naver.com': '네이버 뉴스', 'wiki.bambulab.com': 'Bambu Wiki', 'bambulab.com': 'Bambu Lab',
  'docs.google.com': 'Google 문서', 'instagram.com': 'Instagram', 'aliexpress.com': 'AliExpress', 'coupang.com': '쿠팡',
  'klipper3d.org': 'Klipper', 'github.io': 'GitHub', 'githubusercontent.com': 'GitHub', 'youtube.com': 'YouTube', 'prusa3d.com': 'Prusa', 'tistory.com': '티스토리',
};
function siteName(domain) {
  if (SITE_NAMES[domain]) return SITE_NAMES[domain];
  if (/^[\d.:]+$/.test(domain)) return domain;
  const base = domain.split('.').slice(-2).join('.');
  if (SITE_NAMES[base]) return SITE_NAMES[base];
  const parts = domain.split('.');
  const core = parts.length > 2 && parts[parts.length - 2].length <= 3 ? parts[parts.length - 3] : parts[parts.length - 2] || domain;
  return core.charAt(0).toUpperCase() + core.slice(1);
}
const JUNK_SEG = /^(index|view|viewform|watch|article|articles|post|posts|models?|comments|ko|en|kr|ja|zh|p|v|d|e|s|r|wiki|manual|products?|item|items|detail|amp|reel|reels|tv|shorts|tree|blob|main|master|tag|tags|display|status|share|forms)$/i;
const VER_RE = /^v\d+[\w.-]*$|^\d+([._]\d+)+[\w.-]*$/i;
// 제목을 못 가져왔을 때 주소 조각으로 이름 만들기
//   wiki.snapmaker.com/en/snapmaker_orca/release_notes/v241 → snapmaker orca release notes v241
//   github.com/OrcaSlicer/OrcaSlicer/releases/tag/v2.5.0     → OrcaSlicer releases v2.5.0
function slugTitle(norm) {
  const host = hostOf(norm || '');
  let path = (norm || '').split('?')[0].split('/').slice(1).map((seg) => { try { return decodeURIComponent(seg); } catch { return seg; } });
  if (host === 'github.com' && path.length >= 2) path = path.slice(1);  // 저장소 주인 이름은 뺌
  let ver = '';
  const segs = [];
  for (let seg of path) {
    seg = seg.replace(/\.(html?|php|aspx?)$/i, '');
    if (VER_RE.test(seg)) { ver = seg; continue; }
    if (seg.length < 3 || JUNK_SEG.test(seg) || /^[\d_-]+$/.test(seg)) continue;
    if (!/[-_ ]/.test(seg) && seg.length >= 8 && /\d/.test(seg) && /[a-z]/.test(seg) && /[A-Z]/.test(seg)) continue;  // 대소문자·숫자 섞인 id
    if (/^[A-Za-z0-9]{16,}$/.test(seg)) continue;
    const w = seg.replace(/^\d+[-_]/, '').replace(/[-_+]+/g, ' ').trim();
    if (w.length >= 3 && (!segs.length || segs[segs.length - 1].toLowerCase() !== w.toLowerCase())) segs.push(w);
  }
  if (!segs.length) return '';
  // 맨 뒤의 여러 단어 조각을 중심으로, 4단어가 안 되면 앞 조각을 붙임
  let i = segs.length - 1;
  for (let j = segs.length - 1; j >= 0; j--) if (segs[j].includes(' ')) { i = j; break; }
  const out = [segs[i]];
  for (let j = i - 1; j >= 0 && out.join(' ').split(' ').length < 4; j--) out.unshift(segs[j]);
  return (out.join(' ') + (ver ? ' ' + ver : '')).slice(0, 90);
}
function hueOf(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h % 360; }
function thumbHtml(it) {
  const name = esc(siteName(it.domain));
  const ph = `<span class="ph" style="--h:${hueOf(it.domain)}"><b>${name}</b></span>`;
  if (!it.thumb) return ph;
  return `<img src="${esc(it.thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML=this.dataset.ph" data-ph="${esc(ph)}">`;
}

/* ---------- 가져오기 분석 ---------- */
function targets() {
  return $('target').value.split(',').map((s) => s.trim()).filter(Boolean);
}

function analyze(text) {
  const msgs = parseChat(text);
  const names = targets();
  const senders = new Map();
  const found = new Map();
  let mine = 0, rawLinks = 0;
  for (const m of msgs) {
    senders.set(m.name, (senders.get(m.name) || 0) + 1);
    if (!names.includes(m.name)) continue;
    mine++;
    const labels = linkLabels(m.text);
    // 링크 3개 이상인 메시지(판매처 목록 등)는 한 묶음으로 기억해 마인드맵 가지로 쓴다
    let grp = '', grpTitle = '';
    if (labels.length >= 3) {
      grp = m.date + '|' + m.name;
      const head = cleanLabel(m.text.split('\n')[0].replace(URL_RE, ' '));
      grpTitle = head && head !== labels[0].desc ? head : m.date.slice(0, 10) + ' 목록';
    }
    for (const { url, desc } of labels) {
      rawLinks++;
      const norm = normUrl(url);
      const id = hid(norm);
      let f = found.get(id);
      if (!f) { f = { id, url, norm, domain: hostOf(norm), desc, seen: new Set(), grp, grpTitle }; found.set(id, f); }
      if (!f.desc && desc) f.desc = desc;
      if (!f.grp && grp) { f.grp = grp; f.grpTitle = grpTitle; }
      f.seen.add(m.date + '|' + norm);
    }
  }
  const fresh = [], known = [], matched = new Set();
  for (const f of found.values()) {
    const old = findItem(f.id);
    if (!old) { fresh.push(f); continue; }
    matched.add(old.id);
    const oldDates = new Set((old.seen || []).map((k) => k.split('|')[0]));
    const add = [...f.seen].filter((k) => !oldDates.has(k.split('|')[0]));
    // 예전 파서가 붙인 엉뚱한 설명(입장 알림, 목록 전체)은 이번 분석 결과로 바꿈
    const bad = old.desc && (JUNK_RE.test(old.desc) || (descCounts().get(old.desc) || 0) >= 3);
    const desc = f.desc !== (old.desc || '') && (f.desc || bad) ? f.desc : null;
    const grpNew = f.grp && f.grp !== old.grp ? f.grp : null;
    known.push({ f, old, add, desc, grpNew });
  }
  // 이 파일 기간 안에만 기록이 있는데 이번에는 대상 메시지에서 안 나온 링크 → 다른 사람 링크가 섞였던 것
  const dates = msgs.map((m) => m.date).filter((d) => /^\d{4}-\d\d-\d\d \d\d:\d\d$/.test(d)).sort();
  const lo = dates[0], hi = dates[dates.length - 1];
  const stray = !mine || !lo ? [] : [...S.items.values()].filter((it) => !matched.has(it.id) && it.src !== 'manual' &&
    (it.seen || []).length && it.seen.every((k) => { const d = k.split('|')[0]; return d >= lo && d <= hi; }));
  return { msgs: msgs.length, mine, rawLinks, found, fresh, known, senders, stray, range: [lo, hi] };
}

function firstLast(seenKeys) {
  const ds = seenKeys.map((k) => k.split('|')[0]).filter(Boolean).sort();
  return [ds[0] || '', ds[ds.length - 1] || ''];
}

      ${list.length > 100 ? `<li><span class="t">… 외 ${n(list.length - 100)}개</span></li>` : ''}</ul>`;

    <button class="btn ghost" id="cancelPending" type="button">닫기</button>
  </div>`;
  if (r.stray.length) {
    html += `<div class="stray"><strong>${esc(targets().join(', '))}이(가) 올리지 않은 것으로 보이는 기존 링크 ${n(r.stray.length)}개</strong>
      <span class="names">${esc(r.range[0].slice(0, 10))} ~ ${esc(r.range[1].slice(0, 10))} 사이 대화에서 대상 메시지로 다시 잡히지 않았습니다. 예전 버전이 다른 사람 메시지를 붙여 넣었던 것입니다.</span>
      <ul class="mini">${r.stray.slice(0, 60).map((it) => `<li><span class="d">${esc((it.first || '').slice(0, 10))}</span><span class="t">${esc(clip(it.title || it.desc || slugTitle(it.norm) || it.norm, 100))}</span></li>`).join('')}
        ${r.stray.length > 60 ? `<li><span class="t">… 외 ${n(r.stray.length - 60)}개</span></li>` : ''}</ul>
      <div class="row"><button class="btn" id="delStray" type="button">${n(r.stray.length)}개 삭제</button></div></div>`;
  }
  box.innerHTML = html;
  S.lastText = text; S.lastSource = source;
}

async function savePending() {
  const r = S.pending;
  if (!r) return;
  const btn = $('savePending');
  btn.disabled = true;
  const now = new Date().toISOString();
  const jobs = [];
  for (const f of r.fresh) {
    const seen = [...f.seen].sort().slice(-MAX_SEEN);
    const [first, last] = firstLast(seen);
    jobs.push({ id: f.id, url: f.url, norm: f.norm, domain: f.domain, desc: f.desc, first, last, seen, read: false, added: now, ...(f.grp ? { grp: f.grp, grpTitle: f.grpTitle } : {}) });
  }
  for (const k of r.known) {
    if (!k.add.length && k.desc === null && !k.grpNew) continue;
    const seen = mergeSeen(k.old.seen, k.add);
    const [first, last] = firstLast(seen);
    jobs.push({ ...k.old, seen, first, last, desc: k.desc !== null ? k.desc : (k.old.desc || k.f.desc), ...(k.grpNew ? { grp: k.f.grp, grpTitle: k.f.grpTitle } : {}) });
  }
  let done = 0;
  try {
    for (const it of jobs) {
      await putItem(it);
      done++;
      if (S.backend !== 'local' && jobs.length > 5) btn.textContent = `저장 중… ${done}/${jobs.length}`;
    }
    persist();
    toast(`새 링크 ${r.fresh.length}개 저장 · 중복 ${r.known.length}개는 건너뜀`);
    S.flash = new Set(r.fresh.map((f) => f.id));
    S.pending = null;
    $('preview').hidden = true;
    render();
    runEnrich(new Set(jobs.map((j) => j.id)));
  } catch (e) {
    persist();
    btn.disabled = false;
    btn.textContent = '이어서 저장';
    toast(`${done}/${jobs.length}개까지 저장했습니다. ` + (e && e.code === 'quota_exceeded' ? '저장 공간이 가득 찼습니다.' : '다시 눌러 이어서 저장하세요.'));
    S.pending = analyze(S.lastText);
  }
}

async function deleteMany(ids, label) {
  let done = 0;
  try { for (const id of ids) { await delItem(id); done++; } }
  catch { toast(`${done}/${ids.length}개 삭제 후 멈췄습니다. 다시 눌러 주세요.`); render(); return false; }
  persist(); render();
  toast(`${label} ${done}개 삭제했습니다`);
  return true;
}

/* ---------- 목록 정리: 주소 규칙 변경으로 생긴 중복 합치기, 입장 알림 섞인 설명 지우기 ---------- */
function tidyPlan() {
  const groups = new Map();
  for (const it of S.items.values()) {
    const key = hid(normUrl(it.url));
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(it);
  }
  const merges = [...groups.values()].filter((g) => g.length > 1)
    .map((g) => g.sort((a, b) => (a.first || '').localeCompare(b.first || '')));
  const junk = [...S.items.values()].filter((it) => it.desc && JUNK_RE.test(it.desc));
  const shared = [...S.items.values()].filter((it) => it.desc && (descCounts().get(it.desc) || 0) >= 3).length;
  return { merges, junk, shared };
}
function showTidy() {
  const t = tidyPlan();
  S.tidy = t;
  const box = $('preview');
  box.hidden = false;
  const dup = t.merges.reduce((s, g) => s + g.length - 1, 0);
  box.innerHTML = `<div class="summary"><span class="chip">목록 정리</span>
      <span class="chip ${dup ? 'dup' : ''}">합칠 중복 ${n(dup)}개</span>
      <span class="chip ${t.junk.length ? 'dup' : ''}">입장·퇴장 알림이 섞인 설명 ${n(t.junk.length)}개</span></div>
    ${t.merges.length ? `<ul class="mini">${t.merges.slice(0, 40).map((g) => `<li><span class="d">${g.length}개→1</span><span class="t">${esc(g[0].norm)}</span></li>`).join('')}</ul>` : ''}
    ${t.shared ? `<p class="names">목록형 메시지에서 같은 설명이 복사된 링크가 ${n(t.shared)}개 있습니다. 이건 원래 메시지가 필요해서, 카톡 파일을 위에 다시 넣으면 링크마다 제 이름으로 고쳐집니다.</p>` : ''}
    <div class="row"><button class="btn primary" id="runTidy" type="button" ${dup || t.junk.length ? '' : 'disabled'}>정리하기</button>
    <button class="btn ghost" id="cancelPending" type="button">닫기</button></div>`;
}
async function runTidy() {
  const t = S.tidy;
  if (!t) return;
  $('runTidy').disabled = true;
  try {
    for (const g of t.merges) {
      const [keep, ...rest] = g;
      const seen = mergeSeen(...g.map((x) => x.seen));
      const [first, last] = firstLast(seen);
      const merged = { ...keep, seen, first, last, norm: normUrl(keep.url), read: g.some((x) => x.read) };
      for (const k of ['title', 'summary', 'site', 'thumb', 'fetched', 'desc']) if (!merged[k]) { const src = rest.find((x) => x[k]); if (src) merged[k] = src[k]; }
      await putItem(merged);
      for (const x of rest) await delItem(x.id);
    }
    for (const it of t.junk) {
      if (!S.items.has(it.id)) continue;
      const desc = it.desc.split(/(?<=[.!?])\s+/).filter((x) => !JUNK_RE.test(x)).join(' ').trim();
      await patchItem(it.id, { desc });
    }
    persist();
    toast('정리했습니다');
  } catch { toast('정리하다 멈췄습니다. 다시 눌러 주세요.'); }
  S.tidy = null;
  $('preview').hidden = true;
  render();
}

const n = (x) => Number(x).toLocaleString('ko-KR');
const clip = (s, k) => (s.length > k ? s.slice(0, k) + '…' : s);

  renderEnrich();

  const list = $('list');

  $('vList').setAttribute('aria-pressed', String(!asMap));

  list.hidden = false; $('map').hidden = true;
  if (S.backend === 'pending' || (S.backend === 'db' && !S.loaded)) { list.innerHTML = `<div class="empty">저장된 링크를 불러오는 중입니다…</div>`; return; }
  if (!all.length) {
    list.innerHTML = `<div class="empty"><strong>아직 모은 링크가 없습니다.</strong>
      <ol><li>카톡방 오른쪽 위 메뉴 → 설정 → <b>대화 내보내기</b>(PC는 대화방 메뉴 → 대화 내용 → 내보내기)</li>
      <li>받은 txt 파일을 위의 <b>대화 가져오기</b> 칸에 끌어 놓기</li>
      <li>미리보기에서 새 링크 개수를 확인하고 저장</li></ol>
      <p style="margin:10px 0 0">먼저 보고 싶다면 "텍스트로 붙여넣기 → 예시 대화 넣어 보기"를 눌러 보세요. 저장 버튼을 누르기 전에는 아무것도 저장되지 않습니다.</p></div>`;

    (!q || [i.title, i.summary, i.desc, i.site, i.norm].some((x) => (x || '').toLowerCase().includes(q))));
  const byDate = (a, b) => (a.first || '').localeCompare(b.first || '');
  if (sort === 'old') rows.sort(byDate);
  else if (sort === 'rep') rows.sort((a, b) => (b.seen || []).length - (a.seen || []).length || byDate(b, a));
  else rows.sort((a, b) => byDate(b, a));

  if (!rows.length) { list.innerHTML = `<div class="empty">조건에 맞는 링크가 없습니다.</div>`; return; }
  if (asMap) { list.hidden = true; $('map').hidden = false; list.innerHTML = ''; renderMap(rows); S.flash = null; return; }

  let html = '', month = null;
  for (const i of rows.slice(0, shown)) {

      month = mo;
      html += `<div class="month">${mo ? mo.replace('-', '년 ') + '월' : '날짜 없음'}</div><ul class="items">`;
    } else if (month === null && html === '') html += '<ul class="items">';
    const rep = (i.seen || []).length;
    const title = itemName(i);
    const kakao = i.title && usableDesc(i) && i.desc !== i.title ? i.desc : '';
    const path = i.norm.slice(i.domain.length) || '/';
    const site = i.site || siteName(i.domain);
    const open = S.open.has(i.id);
    let relHtml = '';
    if (open) {
      const rs = related(i.id);
      relHtml = `<div class="rel"><h3>관련 자료 ${rs.length ? (rs[0].how === 'emb' ? '· 의미 비교' : '· 글자 비교') : ''}</h3>` +
        (rs.length ? rs.map((r) => `<a href="#it-${r.it.id}" data-jump="${r.it.id}"><span class="thumb">${thumbHtml(r.it)}</span><span class="rt">${esc(clip(itemName(r.it), 90))}</span><span class="sim">${Math.round(r.sim * 100)}%</span></a>`).join('')
          : `<span style="font-size:.86rem;color:var(--muted)">비슷한 링크를 찾지 못했습니다.${i.title ? '' : ' 제목을 가져오면 더 잘 찾습니다.'}</span>`) + '</div>';
    }
    html += `<li class="item${i.read ? ' read' : ''}${S.flash && S.flash.has(i.id) ? ' flash' : ''}" id="it-${i.id}">
      <a class="thumb" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer" data-open="${i.id}" tabindex="-1" aria-hidden="true">${thumbHtml(i)}</a>
      <div class="body">
        <a class="title" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer" data-open="${i.id}">${esc(clip(title, 140))}</a>
        ${i.summary ? `<span class="sum">${esc(i.summary)}</span>` : ''}
        ${kakao ? `<span class="kakao">${esc(kakao)}</span>` : ''}
        <span class="meta">${esc((i.first || '').slice(0, 10).replace(/-/g, '.'))} · ${esc(site)}${rep > 1 ? ` · <span class="rep" title="${esc((i.seen || []).map((k) => k.split('|')[0]).join('\n'))}">${rep}번 올라옴</span>` : ''}</span>
        <span class="url">${esc(i.domain)}${esc(clip(path, 70))}</span>
      </div>
      <div class="acts">
        <button class="btn ghost" type="button" data-rel="${i.id}" aria-expanded="${open}">${open ? '관련 접기' : '관련'}</button>
        <button class="btn ghost" type="button" data-read="${i.id}">${i.read ? '안 읽음' : '읽음'}</button>
        <button class="btn ghost${armed === i.id ? ' del-confirm' : ''}" type="button" data-del="${i.id}">${armed === i.id ? '정말 삭제' : '삭제'}</button>
      </div>
      ${relHtml}
    </li>`;
  }
  html += '</ul>';
  if (rows.length > shown) html += `<button class="btn more" type="button" id="more">${n(rows.length - shown)}개 더 보기</button>`;
  list.innerHTML = html;
  S.flash = null;
}

/* ---------- 마인드맵 ---------- */
// 가운데 = 올린 사람, 1단계 = 묶음(목록형 메시지 / 주제 / 사이트 / 기타), 2단계 = 링크
const STOPW = new Set(['the', 'and', 'for', 'with', 'this', 'that', 'from', 'your', 'you', 'are', 'how', 'new', 'what', 'why', 'all', 'can', 'out',
  'html', 'http', 'https', 'www', 'com', 'net', 'org', 'reel', 'reels', 'watch', 'shorts', 'post', 'posts', 'comments', 'models', 'model', 'store', 'products',
  '이거', '그냥', '진짜', '오늘', '정리', '공유', '영상', '링크', '이런', '저런', '그런', '있는', '하는', '없는', '같은', '좋은', '이번', '여기', '보면', '있습니다', '합니다']);
const KSUFFIX = /(에서|으로|하는|해서|했다|합니다|입니다|이다|이랑|을|를|이|가|은|는|의|에|로|와|과|도|만)$/;
function words(text) {
  const out = new Set();
  for (let w of (text || '').toLowerCase().match(/[a-z][a-z0-9+]{2,}|[가-힣]{2,}|\d+[a-z]+/g) || []) {
    if (/^[가-힣]/.test(w) && w.length > 2) w = w.replace(KSUFFIX, '');
    if (w.length >= 2 && !STOPW.has(w)) out.add(w);
  }
  return [...out];
}
const itemText = (it) => [it.title, it.summary, usableDesc(it), slugTitle(it.norm)].filter(Boolean).join(' ');
const itemName = (it) => it.title || usableDesc(it) || slugTitle(it.norm) || `${siteName(it.domain)} · ${(it.first || '').slice(5, 10).replace('-', '.')}`;

function buildGroups(rows) {
  const sig = S.ver + '|' + rows.length + '|' + (rows[0] && rows[0].id) + '|' + (rows[rows.length - 1] && rows[rows.length - 1].id);
  if (S.groups && S.groups.sig === sig) return S.groups.list;
  const ids = new Set(rows.map((r) => r.id));
  const taken = new Set(), groups = [];
  const take = (g) => { g.items.forEach((it) => taken.add(it.id)); groups.push(g); };

  // 1) 목록형 메시지(링크 3개 이상 한 번에 올린 것)
  const lists = new Map();
  for (const it of rows) {
    const legacy = (descCounts().get(it.desc) || 0) >= 3 ? 'd:' + it.desc : '';
    const k = it.grp || legacy;
    if (!k) continue;
    if (!lists.has(k)) lists.set(k, { key: 'L:' + k, kind: 'list', items: [], label: it.grpTitle || `${(it.first || '').slice(0, 10)} 목록` });
    lists.get(k).items.push(it);
  }
  for (const g of lists.values()) if (g.items.length >= 3) take(g);

  // 2) 주제: 관련 자료가 많은 링크를 중심으로 이웃을 모음
  const rest = rows.filter((it) => !taken.has(it.id));
  const nb = new Map(rest.map((it) => [it.id, related(it.id, 10).filter((x) => ids.has(x.it.id) && !taken.has(x.it.id))]));
  const seeds = rest.slice().sort((a, b) => nb.get(b.id).length - nb.get(a.id).length);
  for (const seed of seeds) {
    if (taken.has(seed.id)) continue;
    const mem = [seed, ...nb.get(seed.id).map((x) => x.it).filter((it) => !taken.has(it.id))];
    if (mem.length >= 3) take({ key: 'T:' + seed.id, kind: 'topic', items: mem });
  }
  // 묶음에 못 든 링크는 가장 가까운 이웃이 속한 주제로
  const topicOf = new Map();
  for (const g of groups) if (g.kind === 'topic') g.items.forEach((it) => topicOf.set(it.id, g));
  for (const it of rows) {
    if (taken.has(it.id)) continue;
    const best = (nb.get(it.id) || []).find((x) => topicOf.has(x.it.id));
    if (best) { topicOf.get(best.it.id).items.push(it); taken.add(it.id); }
  }

  // 3) 나머지는 사이트별, 작은 건 기타
  const sites = new Map();
  for (const it of rows) {
    if (taken.has(it.id)) continue;
    const nm = siteName(it.domain);
    if (!sites.has(nm)) sites.set(nm, { key: 'S:' + nm, kind: 'site', items: [], label: nm });
    sites.get(nm).items.push(it);
  }
  const etc = { key: 'E', kind: 'site', items: [], label: '기타' };
  for (const g of sites.values()) (g.items.length >= 3 ? groups.push(g) : etc.items.push(...g.items));
  if (etc.items.length) groups.push(etc);

  // 주제 이름: 묶음 안에서 자주 나오고 전체에선 드문 단어 두 개
  const df = new Map();
  const wordsOf = new Map(rows.map((it) => [it.id, words(itemText(it))]));
  for (const ws of wordsOf.values()) for (const w of ws) df.set(w, (df.get(w) || 0) + 1);
  for (const g of groups) {
    if (g.kind !== 'topic') continue;
    const cnt = new Map();
    for (const it of g.items) for (const w of wordsOf.get(it.id)) cnt.set(w, (cnt.get(w) || 0) + 1);
    const top = [...cnt.entries()].filter(([, c]) => c >= 2)
      .map(([w, c]) => [w, c * Math.log(1 + rows.length / df.get(w))]).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([w]) => w);
    g.label = top.length ? top.join(' · ') : clip(itemName(g.items[0]), 18);
  }
  const order = { topic: 0, list: 1, site: 2 };
  groups.sort((a, b) => order[a.kind] - order[b.kind] || (a.key === 'E') - (b.key === 'E') || b.items.length - a.items.length);
  S.groups = { sig, list: groups };
  return groups;
}

const M = { vb: null, open: new Set(), sel: null, pos: new Map() };
function layoutMap(groups) {
  const nodes = [], edges = [];
  M.pos = new Map();
  const pill = (g) => textW(clip(g.label, 22), 14) + textW(String(g.items.length), 12) + 46;
  const totalW = groups.reduce((a, g) => a + pill(g), 0);
  const stagger = groups.length > 12;
  const R1 = Math.max(170, (totalW / (2 * Math.PI)) * (stagger ? 0.6 : 1.05));
  // 각도는 라벨 폭만큼, 펼친 가지는 링크 수만큼 더
  const w = groups.map((g) => (M.open.has(g.key) ? Math.max(pill(g) * 2.5, Math.sqrt(g.items.length) * 70) : pill(g)));
  const tot = w.reduce((a, b) => a + b, 0) || 1;
  let acc = 0;
  groups.forEach((g, i) => {
    const span = (w[i] / tot) * Math.PI * 2;
    const ang = acc + span / 2 - Math.PI / 2;
    acc += span;
    const gr = stagger && i % 2 ? R1 + 60 + 70 * Math.abs(Math.cos(ang)) : R1;  // 좌우는 라벨이 길어 더 벌림
    const gx = Math.cos(ang) * gr, gy = Math.sin(ang) * gr;
    nodes.push({ t: 'g', g, x: gx, y: gy, ang });
    M.pos.set(g.key, [gx, gy]);
    edges.push({ k: 'trunk', a: [0, 0], b: [gx, gy] });
    if (!M.open.has(g.key)) return;
    const items = g.items.slice().sort((a, b) => (b.first || '').localeCompare(a.first || ''));
    const spread = Math.min(span * 0.92, 2.2);
    let idx = 0, ring = 0;
    while (idx < items.length) {
      const r = gr + 130 + ring * 64;
      const cap = Math.max(1, Math.floor((spread * r) / 28));
      const cnt = Math.min(cap, items.length - idx);
      const use = Math.min(spread, (cnt * 28) / r);
      for (let k = 0; k < cnt; k++) {
        const a = ang + (cnt === 1 ? 0 : (k / (cnt - 1) - 0.5) * use);
        const it = items[idx + k];
        const x = Math.cos(a) * r, y = Math.sin(a) * r;
        nodes.push({ t: 'i', it, x, y, a, g, gk: g.key });
        M.pos.set(it.id, [x, y]);
        edges.push({ k: 'leaf', a: [gx, gy], b: [x, y] });
      }
      idx += cnt; ring++;
    }
  });
  return { nodes, edges };
}

const curve = (a, b) => { const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2; return `M${a[0].toFixed(1)},${a[1].toFixed(1)} Q${(mx * 0.92).toFixed(1)},${(my * 0.92).toFixed(1)} ${b[0].toFixed(1)},${b[1].toFixed(1)}`; };
function textW(s, px) { let w = 0; for (const ch of s) w += /[가-힣ㄱ-ㅎ一-龥]/.test(ch) ? px : px * 0.58; return w; }

function renderMap(rows) {
  const groups = buildGroups(rows);
  const valid = new Set(groups.map((g) => g.key));
  for (const k of [...M.open]) if (!valid.has(k)) M.open.delete(k);
  const { nodes, edges } = layoutMap(groups);
  const root = esc(targets()[0] || '전체');
  let svg = '<g id="mapG">';
  for (const e of edges) svg += `<path class="edge ${e.k}" d="${curve(e.a, e.b)}"/>`;
  // 선택한 링크의 관련 자료 → 점선 (접힌 가지면 가지로)
  const relSet = new Set();
  if (M.sel && M.pos.has(M.sel)) {
    for (const r of related(M.sel, 6)) {
      const g = groups.find((gg) => gg.items.some((x) => x.id === r.it.id));
      const to = M.pos.get(r.it.id) || (g && M.pos.get(g.key));
      if (!to) continue;
      relSet.add(r.it.id);
      const from = M.pos.get(M.sel);
      svg += `<path class="edge rel" d="M${from[0].toFixed(1)},${from[1].toFixed(1)} Q0,0 ${to[0].toFixed(1)},${to[1].toFixed(1)}"/>`;
      svg += `<text class="simt" x="${((from[0] + to[0]) / 4).toFixed(1)}" y="${((from[1] + to[1]) / 4).toFixed(1)}">${Math.round(r.sim * 100)}%</text>`;
    }
  }
  svg += `<g class="root"><circle r="${Math.max(34, textW(root, 15) / 2 + 14)}"/><text text-anchor="middle" dy="5">${root}</text></g>`;
  for (const nd of nodes) {
    if (nd.t === 'g') {
      const label = clip(nd.g.label, 22), cnt = String(nd.g.items.length);
      const wpx = textW(label, 14) + textW(cnt, 12) + 32;
      svg += `<g class="grp k-${nd.g.kind}${M.open.has(nd.g.key) ? ' open' : ''}" data-g="${esc(nd.g.key)}" transform="translate(${nd.x.toFixed(1)},${nd.y.toFixed(1)})">
        <rect x="${(-wpx / 2).toFixed(1)}" y="-16" width="${wpx.toFixed(1)}" height="32" rx="16"/>
        <text x="${(-wpx / 2 + 13).toFixed(1)}" dy="5">${esc(label)} <tspan class="cnt">${cnt}</tspan></text></g>`;
    } else {
      const it = nd.it, right = Math.cos(nd.a) >= 0;
      const name = esc(clip(itemName(it), 30));
      const mark = it.thumb
        ? `<image href="${esc(it.thumb)}" x="-15" y="-10" width="30" height="20" preserveAspectRatio="xMidYMid slice"/><rect class="fr" x="-15" y="-10" width="30" height="20" rx="2"/>`
        : `<circle class="dotn" r="4.5"/>`;
      const tx = it.thumb ? 19 : 9;
      svg += `<g class="itm${it.read ? ' read' : ''}${M.sel === it.id ? ' sel' : ''}${relSet.has(it.id) ? ' relh' : ''}" data-i="${it.id}" transform="translate(${nd.x.toFixed(1)},${nd.y.toFixed(1)})">
        ${mark}<text x="${right ? tx : -tx}" dy="4" text-anchor="${right ? 'start' : 'end'}">${name}</text><title>${esc(itemName(it))}</title></g>`;
    }
  }
  svg += '</g>';
  const el = $('mapSvg');
  el.innerHTML = svg;
  if (!M.vb) fitMap();
  else applyVb();
  $('mapHint').hidden = M.open.size > 0;
  renderCard();
}

// 펼친 가지와 그 링크들이 화면에 들어오게: 들어가면 이동만, 넘치면 축소
function focusGroup(key) {
  const g = S.groups && S.groups.list.find((x) => x.key === key);
  if (!g || !M.vb) return;
  const pts = [M.pos.get(key), ...g.items.map((it) => M.pos.get(it.id))].filter(Boolean);
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  const pad = 170;
  const bx = Math.min(...xs) - pad, by = Math.min(...ys) - 40, bw = Math.max(...xs) - Math.min(...xs) + pad * 2, bh = Math.max(...ys) - Math.min(...ys) + 80;
  const ar = M.vb.w / M.vb.h;
  let w = Math.max(M.vb.w, bw, bh * ar);
  const h = w / ar;
  M.vb = { x: bx + bw / 2 - w / 2, y: by + bh / 2 - h / 2, w, h };
  applyVb();
}

function fitMap() {
  const g = $('mapG');
  if (!g) return;
  const bb = g.getBBox();
  const pad = 40;
  const box = $('map').getBoundingClientRect();
  const ar = box.width && box.height ? box.width / box.height : 1.6;
  let w = bb.width + pad * 2, h = bb.height + pad * 2;
  if (w / h < ar) w = h * ar; else h = w / ar;
  M.vb = { x: bb.x + bb.width / 2 - w / 2, y: bb.y + bb.height / 2 - h / 2, w, h };
  applyVb();
}
function applyVb() { const v = M.vb; $('mapSvg').setAttribute('viewBox', `${v.x} ${v.y} ${v.w} ${v.h}`); }
function zoomMap(f, cx, cy) {
  const v = M.vb;
  if (cx === undefined) { cx = v.x + v.w / 2; cy = v.y + v.h / 2; }
  const w = Math.min(Math.max(v.w * f, 120), 20000), k = w / v.w;
  M.vb = { x: cx - (cx - v.x) * k, y: cy - (cy - v.y) * k, w, h: v.h * k };
  applyVb();
}
function svgPoint(evt) {
  const r = $('mapSvg').getBoundingClientRect(), v = M.vb;
  return [v.x + ((evt.clientX - r.left) / r.width) * v.w, v.y + ((evt.clientY - r.top) / r.height) * v.h];
}

function renderCard() {
  const card = $('mapCard');
  const it = M.sel && S.items.get(M.sel);
  if (!it) { card.hidden = true; return; }
  card.hidden = false;
  const rs = related(it.id, 6);
  card.innerHTML = `<button class="btn ghost x" type="button" data-close="1" aria-label="닫기">✕</button>
    <span class="thumb">${thumbHtml(it)}</span>
    <span class="ct">${esc(clip(itemName(it), 120))}</span>
    ${it.summary ? `<span class="sum" style="color:var(--muted)">${esc(it.summary)}</span>` : ''}
    ${it.title && usableDesc(it) && it.desc !== it.title ? `<span class="kakao">${esc(it.desc)}</span>` : ''}
    <span class="meta" style="font-family:var(--font-mono);font-size:.76rem;color:var(--muted)">${esc((it.first || '').slice(0, 10))} · ${esc(it.site || siteName(it.domain))}${(it.seen || []).length > 1 ? ` · ${it.seen.length}번 올라옴` : ''}</span>
    <div class="row"><a class="btn primary" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer" data-open="${it.id}">열기</a>
      <button class="btn" type="button" data-tolist="${it.id}">목록에서 보기</button></div>
    <div class="rel"><h3>관련 자료${rs.length ? (rs[0].how === 'emb' ? ' · 의미 비교' : ' · 글자 비교') : ''}</h3>
      ${rs.length ? rs.map((r) => `<a href="#" data-pick="${r.it.id}"><span class="thumb">${thumbHtml(r.it)}</span><span class="rt">${esc(clip(itemName(r.it), 60))}</span><span class="sim">${Math.round(r.sim * 100)}%</span></a>`).join('')
        : '<span style="color:var(--muted)">비슷한 링크를 찾지 못했습니다.</span>'}</div>`;
}

function pickOnMap(id) {
  M.sel = id;
  const g = S.groups && S.groups.list.find((gg) => gg.items.some((x) => x.id === id));
  if (g) M.open.add(g.key);
  render();
  if (g) focusGroup(g.key);
}

(() => {
  const svg = $('mapSvg');
  let drag = null, moved = false;
  svg.addEventListener('pointerdown', (e) => {
    drag = { x: e.clientX, y: e.clientY, vb: { ...M.vb } }; moved = false;
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener('pointermove', (e) => {
    if (!drag || !M.vb) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!moved && Math.hypot(dx, dy) < 4) return;
    moved = true; svg.classList.add('drag');
    const r = svg.getBoundingClientRect();
    M.vb = { ...drag.vb, x: drag.vb.x - (dx / r.width) * drag.vb.w, y: drag.vb.y - (dy / r.height) * drag.vb.h };
    applyVb();
  });
  svg.addEventListener('pointerup', (e) => {
    svg.classList.remove('drag');
    const wasDrag = moved; drag = null;
    if (wasDrag) return;
    const t = document.elementFromPoint(e.clientX, e.clientY);
    const g = t && t.closest('[data-g]'), i = t && t.closest('[data-i]');
    if (g) {
      const k = g.dataset.g;
      if (M.open.has(k)) { M.open.delete(k); render(); }
      else { M.open.add(k); render(); focusGroup(k); }
    }
    else if (i) { M.sel = M.sel === i.dataset.i ? null : i.dataset.i; render(); }
    else if (M.sel) { M.sel = null; render(); }
  });
  svg.addEventListener('wheel', (e) => { if (!M.vb) return; e.preventDefault(); const [cx, cy] = svgPoint(e); zoomMap(e.deltaY > 0 ? 1.15 : 1 / 1.15, cx, cy); }, { passive: false });
  $('mzIn').addEventListener('click', () => zoomMap(1 / 1.3));
  $('mzOut').addEventListener('click', () => zoomMap(1.3));
  $('mzFit').addEventListener('click', () => { M.vb = null; render(); });
  $('mzAll').addEventListener('click', () => {
    const all = S.groups ? S.groups.list.map((g) => g.key) : [];
    if (M.open.size >= all.length) M.open.clear(); else all.forEach((k) => M.open.add(k));
    M.vb = null; render();
    $('mzAll').textContent = M.open.size ? '모두 접기' : '모두 펼치기';
  });
  $('mapCard').addEventListener('click', (e) => {
    const p = e.target.closest('[data-pick]');
    if (p) { e.preventDefault(); pickOnMap(p.dataset.pick); return; }
    const o = e.target.closest('[data-open]');
    if (o) { const it = S.items.get(o.dataset.open); if (it && !it.read) patchItem(it.id, { read: true }).then(render, () => {}); return; }
    const l = e.target.closest('[data-tolist]');
    if (l) { setView('list'); jumpTo(l.dataset.tolist); return; }
    if (e.target.closest('[data-close]')) { M.sel = null; render(); }
  });
})();

async function offerFile(filename, data, mime) {
  const c = window.claude;
  if (c && typeof c.use === 'function') {
    const dl = await c.use('downloads');
    if (dl) {
      try { await dl.save({ filename, data }); return; }
      catch (e) { if (e && e.code === 'declined') return; toast('파일을 내려받지 못했습니다. (' + (e && e.code) + ')'); return; }
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: mime }));
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const today = () => new Date().toISOString().slice(0, 10);
function exportCsv() {
  const q = (s) => '"' + String(s ?? '').replace(/"/g, '""') + '"';
  const rows = [...S.items.values()].sort((a, b) => (a.first || '').localeCompare(b.first || ''));
  const csv = '\uFEFF' + ['처음 올라온 날짜,마지막,횟수,사이트,제목,카톡 설명,링크,읽음']
    .concat(rows.map((i) => [i.first, i.last, (i.seen || []).length, i.domain, i.title, i.desc, i.url, i.read ? 'Y' : ''].map(q).join(','))).join('\r\n');
  offerFile(`쩡마술사_링크_${today()}.csv`, csv, 'text/csv');
}
function exportJson() {
  offerFile(`쩡마술사_링크_백업_${today()}.json`, JSON.stringify({ v: 1, items: [...S.items.values()] }, null, 1), 'application/json');
}
async function importJson(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { toast('JSON 백업 파일이 아닙니다.'); return; }
  const items = Array.isArray(data) ? data : data.items;
  if (!Array.isArray(items)) { toast('백업 파일에서 링크 목록을 찾지 못했습니다.'); return; }
  let added = 0, merged = 0;
  try {
    for (const raw of items) {
      if (!raw || !raw.url) continue;
      const norm = normUrl(raw.url), id = hid(norm);
      const old = findItem(id);
      if (!old) { await putItem({ ...raw, id, norm, domain: hostOf(norm) }); added++; continue; }
      const seen = mergeSeen(old.seen, raw.seen);
      // 다른 곳(로컬 서버)에서 가져온 제목·썸네일·벡터는 비어 있는 쪽을 채움
      const extra = {};
      for (const k of ['title', 'summary', 'site', 'thumb', 'fetched']) if (!old[k] && raw[k]) extra[k] = raw[k];
      if (raw.emb && raw.embSrc && raw.embSrc !== old.embSrc) { extra.emb = raw.emb; extra.embModel = raw.embModel; extra.embSrc = raw.embSrc; }
      if (seen.length !== (old.seen || []).length || Object.keys(extra).length) {
        const [first, last] = firstLast(seen);
        await putItem({ ...old, ...extra, seen, first, last, read: old.read || !!raw.read });
        merged++;
      }
    }
  } finally {
    persist();
    render();
    toast(`백업에서 ${added}개 추가, ${merged}개 합침`);
  }
}

}
